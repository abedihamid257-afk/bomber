<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسپمر بمبر | Spammer Bomber</title>
    <meta property="og:title" content="اسپمر بمبر | Spammer Bomber">
    <meta property="og:description" content="پنل مدیریت">
    <meta property="og:type" content="website">
    <meta name="robots" content="noindex, nofollow">
    
    <style>
        :root {
            --bg: #030712;
            --card: #0F0F1A;
            --text: #F8FAFC;
            --text2: #94A3B8;
            --primary: #7C3AED;
            --secondary: #06B6D4;
            --accent: #F43F5E;
            --gold: #FBBF24;
            --green: #10B981;
            --border: rgba(255,255,255,0.06);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .bg-grid {
            position: fixed; top:0; left:0; width:100%; height:100%;
            z-index:0; pointer-events:none;
            background-image: linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px);
            background-size:50px 50px;
            animation:gridShift 20s linear infinite;
        }
        @keyframes gridShift { 0%{transform:translate(0,0)} 100%{transform:translate(50px,50px)} }

        .bg-orb {
            position:fixed; border-radius:50%; filter:blur(100px); opacity:0.3;
            pointer-events:none; z-index:0;
        }
        .orb-1{width:400px;height:400px;background:rgba(124,58,237,0.4);top:-100px;left:-80px}
        .orb-2{width:350px;height:350px;background:rgba(6,182,212,0.3);bottom:-100px;right:-60px}

        .login-card {
            position:relative; z-index:1;
            background:var(--card); border:1px solid var(--border);
            border-radius:24px; padding:45px 35px;
            max-width:440px; width:100%;
            box-shadow:0 30px 60px rgba(0,0,0,0.6),0 0 100px rgba(124,58,237,0.1);
            text-align:center;
            animation:fadeIn 0.6s ease;
        }
        @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

        .logo {
            width:75px; height:75px;
            background:linear-gradient(135deg, #F43F5E, #FF6B35);
            border-radius:20px; display:inline-flex; align-items:center;
            justify-content:center; font-size:2.2rem; margin-bottom:18px;
            box-shadow:0 0 50px rgba(244,63,94,0.5);
            animation:logoPulse 2s ease-in-out infinite;
        }
        @keyframes logoPulse { 0%,100%{box-shadow:0 0 50px rgba(244,63,94,0.5)} 50%{box-shadow:0 0 80px rgba(244,63,94,0.8)} }

        .title {
            font-size:2rem; font-weight:900; margin-bottom:5px;
            background:linear-gradient(135deg, #F43F5E, #FF6B35, #FFD700);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .title-en {
            font-size:0.85rem; font-weight:700; color:var(--text2);
            letter-spacing:3px; margin-bottom:25px;
        }

        .form-group { margin-bottom:15px; text-align:right; }
        .form-group label { display:block; margin-bottom:5px; color:var(--text2); font-size:0.78rem; font-weight:600; }
        .form-input {
            width:100%; padding:12px 16px; background:rgba(255,255,255,0.03);
            border:2px solid var(--border); border-radius:12px;
            color:var(--text); font-size:0.95rem; font-family:inherit;
            outline:none; transition:all 0.3s; direction:ltr; text-align:center;
            letter-spacing:4px;
        }
        .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(244,63,94,0.1); }

        .btn-login {
            width:100%; padding:14px; border-radius:14px; border:none;
            cursor:pointer; font-weight:800; font-size:1rem;
            color:white; font-family:inherit; transition:all 0.3s;
            background:linear-gradient(135deg, #F43F5E, #FF6B35);
            box-shadow:0 8px 30px rgba(244,63,94,0.4); margin-top:12px;
        }
        .btn-login:hover { transform:translateY(-3px); box-shadow:0 15px 40px rgba(244,63,94,0.6); }
        .btn-login:active { transform:scale(0.95); }

        .error-msg { color:#F43F5E; font-size:0.75rem; margin-top:10px; display:none; }

        /* بمبر */
        .bomb-card {
            position:relative; z-index:1;
            background:var(--card); border:1px solid var(--border);
            border-radius:20px; padding:30px 25px 18px;
            max-width:480px; width:100%;
            box-shadow:0 30px 60px rgba(0,0,0,0.6);
            display:none;
        }
        .bomb-card.show { display:block; animation:fadeIn 0.4s ease; }

        .bomb-card h2 {
            text-align:center; font-size:1.5rem; font-weight:900;
            background:linear-gradient(135deg, #F43F5E, #FF6B35, #FFD700);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; margin-bottom:5px;
        }
        .bomb-card .sub { text-align:center; color:var(--text2); font-size:0.75rem; margin-bottom:18px; }

        .mode-btns { display:flex; gap:8px; margin:15px 0; }
        .mode-btn {
            flex:1; padding:12px; border-radius:12px; border:2px solid var(--border);
            cursor:pointer; font-weight:800; font-size:0.9rem;
            color:var(--text2); font-family:inherit; background:rgba(255,255,255,0.02);
            transition:all 0.3s ease;
        }
        .mode-btn.active {
            background:linear-gradient(135deg, #F43F5E, #FF6B35);
            color:white; border-color:transparent;
            box-shadow:0 5px 20px rgba(244,63,94,0.3);
        }
        .mode-btn .count { font-size:0.7rem; opacity:0.7; display:block; }

        .btn-send {
            width:100%; padding:13px; border-radius:12px; border:none;
            cursor:pointer; font-weight:800; font-size:0.95rem;
            color:white; font-family:inherit; transition:all 0.3s ease;
            background:linear-gradient(135deg, #F43F5E, #FF6B35);
            box-shadow:0 6px 20px rgba(244,63,94,0.3);
        }
        .btn-send:disabled { opacity:0.5; cursor:not-allowed; }

        .log-box {
            width:100%; height:160px; background:rgba(0,0,0,0.4);
            border:2px solid var(--border); border-radius:10px;
            padding:10px; color:var(--green); font-family:'Courier New', monospace;
            font-size:0.7rem; direction:ltr; text-align:left;
            overflow-y:auto; resize:none; margin-top:8px;
        }

        .status {
            text-align:center; padding:8px; border-radius:8px;
            margin:8px 0; font-weight:700; font-size:0.8rem; display:none;
        }
        .status.sending { display:block; background:rgba(255,107,53,0.1); color:#FF6B35; border:1px solid rgba(255,107,53,0.3); }
        .status.done { display:block; background:rgba(16,185,129,0.1); color:var(--green); border:1px solid rgba(16,185,129,0.3); }

        .logout-btn {
            position:absolute; top:12px; left:12px;
            background:rgba(255,255,255,0.05); border:1px solid var(--border);
            color:var(--text2); padding:6px 12px; border-radius:8px;
            cursor:pointer; font-size:0.7rem; font-family:inherit;
        }
        .logout-btn:hover { background:rgba(244,63,94,0.1); color:#F43F5E; }

        .cf{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
        .cfb{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;border-radius:8px;text-decoration:none;font-weight:700;font-size:.68rem;color:white;font-family:inherit;transition:all .3s}
        .cfb:hover{transform:translateY(-2px)}
        .cfb1{background:#10B981}.cfb2{background:#8B5CF6}.cfb3{background:#06B6D4}.cfb4{background:#F59E0B}

        @media(max-width:480px){
            .login-card{padding:30px 18px}
            .bomb-card{padding:22px 14px 14px}
            .title{font-size:1.5rem}
            .mode-btn{font-size:0.8rem;padding:10px}
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- صفحه ورود -->
    <div class="login-card" id="loginPage">
        <div class="logo">💣</div>
        <h1 class="title">اسپمر بمبر</h1>
        <p class="title-en">SPAMMER BOMBER</p>

        <div class="form-group">
            <label>🔑 رمز عبور</label>
            <input type="password" class="form-input" id="passInput" placeholder="••••••••••••" onkeydown="if(event.key==='Enter')checkPass()">
        </div>

        <button class="btn-login" onclick="checkPass()">🚀 ورود</button>
        <p class="error-msg" id="passError">❌ رمز عبور اشتباه است</p>
    </div>

    <!-- بمبر -->
    <div class="bomb-card" id="bombCard">
        <button class="logout-btn" onclick="logout()">🚪 خروج</button>
        
        <h2>💣 اسپمر بمبر</h2>
        <p class="sub">🔥 سه حالته | Spammer Bomber</p>

        <div class="status" id="statusSending">⏳ در حال ارسال...</div>
        <div class="status" id="statusDone">✅ ارسال با موفقیت به اتمام رسید!</div>

        <input type="text" class="form-input" id="phone" placeholder="09XXXXXXXXX" maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/g,'')" style="letter-spacing:0;">

        <div class="mode-btns">
            <button class="mode-btn" data-mode="2" onclick="setMode(2, this)">🟢 سبک<span class="count">۲ سرویس</span></button>
            <button class="mode-btn active" data-mode="10" onclick="setMode(10, this)">🟡 متوسط<span class="count">۱۰ سرویس</span></button>
            <button class="mode-btn" data-mode="20" onclick="setMode(20, this)">🔴 سنگین<span class="count">۲۰ سرویس</span></button>
        </div>

        <button class="btn-send" id="sendBtn" onclick="startBomb()">🚀 ارسال پیامک</button>

        <label style="color:var(--text2);font-size:0.75rem;margin-top:8px;display:block;">📋 لاگ ارسال</label>
        <textarea class="log-box" id="logBox" readonly></textarea>

        <div class="cf">
            <a href="https://rubika.ir/admin10blue" target="_blank" class="cfb cfb1">👤 ادمین</a>
            <a href="https://rubika.ir/GrahamBot" target="_blank" class="cfb cfb2">🤖 بات</a>
            <a href="https://rubika.ir/Gameing019" target="_blank" class="cfb cfb3">📢 کانال</a>
            <a href="https://ttr.ir/ads019" target="_blank" class="cfb cfb4">📢 تبلیغات</a>
        </div>
    </div>

    <script>
        let selectedMode = 10;

        if (sessionStorage.getItem('sp_logged') === 'true') {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('bombCard').classList.add('show');
        }

        async function checkPass() {
            const password = document.getElementById('passInput').value;
            try {
                const resp = await fetch('/api/check-pass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });
                const data = await resp.json();
                if (data.success) {
                    sessionStorage.setItem('sp_logged', 'true');
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('bombCard').classList.add('show');
                    document.getElementById('passError').style.display = 'none';
                } else {
                    document.getElementById('passError').style.display = 'block';
                    document.getElementById('passInput').value = '';
                }
            } catch(e) {
                document.getElementById('passError').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('sp_logged');
            document.getElementById('bombCard').classList.remove('show');
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('passInput').value = '';
        }

        function setMode(mode, btn) {
            selectedMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function startBomb() {
            const phone = document.getElementById('phone').value;
            const logBox = document.getElementById('logBox');
            const sendBtn = document.getElementById('sendBtn');

            document.querySelectorAll('.status').forEach(s => s.className = 'status');

            if (!/^09[0-9]{9}$/.test(phone)) {
                alert('فرمت شماره اشتباه است!');
                return;
            }

            document.getElementById('statusSending').className = 'status sending';
            sendBtn.disabled = true;
            sendBtn.textContent = '⏳ در حال ارسال...';
            logBox.value = '';

            const now = new Date().toLocaleTimeString('fa-IR');
            logBox.value += `[${now}] 🚀 شروع اسپمر بمبر\n📱 ${phone} | ⚡ ${selectedMode} سرویس\n━━━━━━━━━━━━━━━━━━━━\n\n`;

            try {
                const resp = await fetch('/api/send-sms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, mode: selectedMode })
                });
                const data = await resp.json();
                
                if (data.results) {
                    data.results.forEach((r, i) => {
                        const time = new Date().toLocaleTimeString('fa-IR');
                        logBox.value += `[${time}] ✅ ${i+1}. ${r.name}\n`;
                    });
                }
            } catch(e) {
                logBox.value += `⚠️ خطا در ارتباط\n`;
            }

            const endTime = new Date().toLocaleTimeString('fa-IR');
            logBox.value += `\n━━━━━━━━━━━━━━━━━━━━\n[${endTime}] ✅ اتمام!\n`;

            document.getElementById('statusSending').className = 'status';
            document.getElementById('statusDone').className = 'status done';
            sendBtn.disabled = false;
            sendBtn.textContent = '🚀 ارسال پیامک';
        }
    </script>

</body>
</html>
